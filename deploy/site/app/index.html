<!doctype html>
<html lang="ru" data-client="web" data-cloud-only="true" data-hide-combat="true" data-era-theme="technological">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080d" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://sync.grpg-sync.ru; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="same-origin" />
    <title>GRPGI Web Client</title>
    <link rel="stylesheet" href="./styles.css?v=1.0.84" />
  </head>
  <body>
    <div class="web-galaxy-bg" aria-hidden="true">
      <div class="web-galaxy-layer galaxy-one"></div>
      <div class="web-galaxy-layer galaxy-two"></div>
    </div>

    <div id="login-screen" class="boot-shell hidden">
      <div class="boot-card desktop-login-card">
        <div class="eyebrow">CHARACTER_ACCESS</div>
        <h1>Вход в профиль</h1>
        <p class="muted">Выберите персонажа и введите его пароль. Подключение к кампании выполняется автоматически.</p>
        <form id="login-form" class="form stack-lg">
          <label class="field campaign-login-field-v1049">
            <span>Игровая кампания</span>
            <select class="input" id="login-campaign"></select>
            <small class="campaign-login-hint-v1049" id="login-campaign-hint"></small>
          </label>
          <label class="field">
            <span>Персонаж</span>
            <select class="input" id="login-player"></select>
          </label>
          <label class="field">
            <span>Пароль</span>
            <input class="input" id="login-pass" type="password" placeholder="Пароль персонажа" autocomplete="current-password" />
          </label>
          <div id="login-preview" class="preview-card"></div>
          <label class="consent-line remember-login-line">
            <input type="checkbox" id="login-remember-login" checked />
            <span><b>Запомнить вход на этом устройстве</b> на срок до 30 дней. Пароль персонажа в локальное хранилище не записывается.</span>
          </label>
          <label class="consent-line privacy-consent-login-v1068">
            <input type="checkbox" id="login-privacy-consent-v1068" required />
            <span>Я принимаю <a href="../privacy.html" target="_blank" rel="noopener">Правила использования</a> и подтверждаю, что ознакомлен(а) с Политикой конфиденциальности.</span>
          </label>
          <p class="privacy-inline-note">Единый документ также описывает модерацию, доступ к игровым чатам и хранение скрытых сообщений.</p>
          <div class="button-row">
            <button class="primary" type="submit">ВОЙТИ</button>
            <button class="secondary" type="button" id="register-open-v1052">РЕГИСТРАЦИЯ</button>
            <button class="secondary" type="button" id="login-guest-btn">ГОСТЕВОЙ ВХОД</button>
          </div>
          <div id="login-status" class="status-line muted"></div>
        </form>
        <div id="registration-panel-v1052" class="registration-panel-v1052 hidden"></div>
      </div>
    </div>

    <div id="app-shell" class="app-shell hidden">
      <header class="topbar title-bar">
        <div class="title-main">
          <div class="eyebrow" id="campaign-label">CAMPAIGN</div>
          <h1 id="screen-title">WEB CLIENT</h1>
          <div class="topbar-sub" id="screen-subtitle">PocketBase secure session</div>
        </div>
        <div class="topbar-actions">
          <a class="secondary link-btn" href="../" title="Страница загрузки">ЗАГРУЗКИ</a>
          <button class="secondary" type="button" id="web-reload-btn">RELOAD</button>
        </div>
      </header>

      <main class="screens desktop-module-shell">
        <section id="screen-home" class="screen active"></section>
        <section id="screen-archive" class="screen"></section>
        <section id="screen-market" class="screen"></section>
        <section id="screen-chat" class="screen"></section>
        <section id="screen-profile" class="screen"></section>
      </main>

      <nav class="bottom-nav desktop-dock">
        <button class="nav-btn active" data-screen="home" type="button"><span>НАВИГАТОР</span></button>
        <button class="nav-btn" data-screen="archive" type="button"><span>АРХИВ</span></button>
        <button class="nav-btn" data-screen="market" type="button"><span>ТЕРМИНАЛ</span></button>
        <button class="nav-btn" data-screen="chat" type="button"><span>СООБЩЕНИЯ</span></button>
        <button class="nav-btn" data-screen="profile" type="button"><span>ПРОФИЛЬ</span></button>
      </nav>
    </div>

    <div id="toast-stack" class="toast-stack"></div>
    <script src="./runtime-config.js?v=1.0.71"></script>
    <script src="./rich-text-scope.js?v=1.0.84"></script>
    <script src="./market-engine.js?v=1.0.84"></script>
    <script src="./app.js?v=1.0.84"></script>
  </body>
</html>
