<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' data: blob: https: file:; media-src 'self' data: blob: https: file:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Интерактивная статья</title>
  <style>
    :root {
      color-scheme: dark;
      background: transparent;
    }
    html, body {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #dce9f4;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #grpgi-article-root {
      display: flow-root;
      width: 100%;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    #grpgi-article-root img.rich-inline-image-v1086 {
      display: block;
      max-width: min(100%, 900px);
      max-height: 720px;
      width: auto;
      height: auto;
      margin: 12px 0;
      border-radius: 10px;
      object-fit: contain;
    }
  </style>
<style>.rich-audio-v315{display:grid;grid-template-columns:44px minmax(80px,1fr) auto;gap:12px;align-items:center;padding:16px;margin:16px 0;border:1px solid #8d7045;border-radius:6px;background:linear-gradient(135deg,#2d271c,#100f0c);color:#e8d8b9;box-sizing:border-box;max-width:100%;font:14px/1.4 system-ui}
.rich-audio-v315>strong{grid-column:1/-1;overflow-wrap:anywhere;font-size:12px;letter-spacing:.06em}.rich-audio-v315>audio{display:none}.rich-audio-v315 button{min-width:44px;min-height:44px;color:#efd49d;background:#4c3b22;border:1px solid #ac864d;border-radius:4px;cursor:pointer}.rich-audio-v315 input{accent-color:#d1ac70;min-width:0;width:100%;padding:0;box-shadow:none}.rich-audio-v315>label{grid-column:2/-1;display:flex;gap:12px;align-items:center;font-size:11px}.rich-audio-v315>label input{max-width:160px}.rich-audio-v315 output{font:11px monospace;white-space:nowrap}.rich-audio-v315 :focus-visible{outline:2px solid #e8c787;outline-offset:3px}.rich-size-dialog-v315{width:min(460px,92vw);background:#17140e;color:#e8d8b9;border:1px solid #ad864a;padding:24px}.rich-size-dialog-v315::backdrop{background:#000a}.rich-size-dialog-v315 input{display:block;width:100%;margin:10px 0;padding:10px}.rich-size-dialog-v315 button{min-height:44px;margin:4px;padding:8px 12px;background:#40331e;color:#efd49d;border:1px solid #ac864d}
@media(max-width:480px){.rich-audio-v315{gap:8px;padding:12px;grid-template-columns:44px minmax(0,1fr)}.rich-audio-v315 output{grid-column:2}.rich-audio-v315>label{grid-column:1/-1}}
</style>
</head>
<body>
  <main id="grpgi-article-root"></main>
  <script>
    (() => {
      'use strict';

      const PROTOCOL = 'grpgi-rich-v1083';
      const root = document.getElementById('grpgi-article-root');
      let token = '';
      let initialized = false;
      let lastHeight = 0;

      const post = (suffix, detail = {}) => {
        parent.postMessage({ type: `${PROTOCOL}:${suffix}`, token, ...detail }, '*');
      };

      const articleIdFromHref = value => {
        const raw = String(value || '').trim();
        const direct = raw.match(/^(?:article:|local-article:)(.+)$/i);
        const uri = raw.match(/^(?:article|local-article):\/\/(.+)$/i);
        const id = String(direct?.[1] || uri?.[1] || '').replace(/^\/+/, '').trim();
        if (!id) return '';
        try { return decodeURIComponent(id); } catch { return id; }
      };

      const entityFromLink = link => {
        const raw = String(link?.getAttribute?.('href') || '').trim();
        const match = raw.match(/^(player|character|npc):(?:\/\/)?(.+)$/i);
        const entityType = String(link?.dataset?.entityType || match?.[1] || '').toLowerCase();
        const entityId = String(link?.dataset?.entityId || match?.[2] || '').replace(/^\/+/, '').trim();
        return { entityType: entityType === 'character' ? 'player' : entityType, entityId };
      };

      const currentHeight = () => Math.max(
        160,
        Math.ceil(root.scrollHeight || 0),
        Math.ceil(document.body.scrollHeight || 0),
        Math.ceil(document.documentElement.scrollHeight || 0)
      );

      const reportHeight = () => {
        if (!initialized) return;
        const height = currentHeight();
        if (height === lastHeight) return;
        lastHeight = height;
        post('resize', { height });
      };

      const reportError = error => {
        const message = String(error?.message || error || 'Unknown interactive article error');
        post('error', { message: message.slice(0, 1000) });
      };

      const render = html => {
        const template = document.createElement('template');
        template.innerHTML = String(html || '');
        const scripts = [];
        template.content.querySelectorAll('script').forEach(script => {
          const type = String(script.getAttribute('type') || '').trim().toLowerCase();
          const executable = !type || type === 'text/javascript' || type === 'application/javascript';
          if (executable && !script.hasAttribute('src')) scripts.push(script.textContent || '');
          script.remove();
        });
        template.content.querySelectorAll('base, meta, link, iframe, object, embed, form').forEach(node => node.remove());
        template.content.querySelectorAll('[href]').forEach(node => {
          if (/^javascript:/i.test(String(node.getAttribute('href') || '').trim())) node.removeAttribute('href');
        });

        root.replaceChildren(template.content);
        initialized = true;
        reportHeight();

        if (scripts.length) {
          try {
            const run = new Function(`"use strict";\n${scripts.join('\n;\n')}\n//# sourceURL=grpgi-interactive-article.js`);
            run.call(window);
          } catch (error) {
            reportError(error);
          }
        }
        requestAnimationFrame(reportHeight);
      };

      document.addEventListener('click', event => {
        const link = event.target?.closest?.('a[href], a[data-article-id], [data-article-link], a[data-entity-id]');
        if (!link) return;
        const articleId = String(link.dataset?.articleId || link.dataset?.articleLink || articleIdFromHref(link.getAttribute('href') || '')).trim();
        if (articleId) {
          event.preventDefault();
          post('article-link', { articleId });
          return;
        }
        const { entityType, entityId } = entityFromLink(link);
        if (!['player', 'npc'].includes(entityType) || !entityId) return;
        event.preventDefault();
        post('entity-link', { entityType, entityId });
      });

      window.addEventListener('message', event => {
        const message = event?.data;
        if (event.source !== parent || message?.type !== `${PROTOCOL}:init` || initialized) return;
        token = String(message.token || '');
        if (!token) return;
        render(message.html || '');
      });
      window.addEventListener('error', event => reportError(event.error || event.message));
      window.addEventListener('unhandledrejection', event => reportError(event.reason));
      window.addEventListener('load', reportHeight, { once: true });
      document.addEventListener('load', reportHeight, true);

      if (typeof ResizeObserver === 'function') new ResizeObserver(reportHeight).observe(root);
      if (typeof MutationObserver === 'function') new MutationObserver(reportHeight).observe(root, { childList: true, subtree: true, characterData: true, attributes: true });
      setInterval(reportHeight, 1000);
      post('ready');
    })();
  </script>
<script>(function(root){
'use strict';
function hydrate(scope=document){
 for(const audio of scope.querySelectorAll?.('audio[data-grpg-audio-v315]')||[]){
  if(audio.dataset.ready315)continue;audio.dataset.ready315='1';audio.preload='metadata';audio.autoplay=false;
  const box=document.createElement('section');box.className='rich-audio-v315';
  const label=document.createElement('strong');label.textContent=audio.getAttribute('data-title')||'Аудиозапись';
  const play=document.createElement('button');play.type='button';play.textContent='▶';play.setAttribute('aria-label','Воспроизвести');
  const seek=document.createElement('input');seek.type='range';seek.min='0';seek.max='100';seek.value='0';seek.step='.1';seek.setAttribute('aria-label','Перемотка');
  const time=document.createElement('output');time.textContent='0:00 / 0:00';
  const volume=document.createElement('input');volume.type='range';volume.min='0';volume.max='1';volume.step='.01';volume.value=String(audio.volume);volume.setAttribute('aria-label','Громкость');
  const volumeLabel=document.createElement('label');volumeLabel.textContent='Громкость';volumeLabel.append(volume);
  audio.before(box);box.append(label,audio,play,seek,time,volumeLabel);audio.controls=false;
  const stamp=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
  const update=()=>{const duration=audio.duration;seek.disabled=!Number.isFinite(duration)||duration<=0;if(!seek.disabled)seek.value=String(100*audio.currentTime/duration);time.textContent=stamp(audio.currentTime)+' / '+stamp(duration);play.textContent=audio.paused?'▶':'Ⅱ';play.setAttribute('aria-label',audio.paused?'Воспроизвести':'Пауза');};
  play.onclick=async()=>{try{if(audio.paused)await audio.play();else audio.pause();}catch{time.textContent='Аудиофайл недоступен';}};
  seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(seek.value)/100;};
  volume.oninput=()=>{audio.volume=Number(volume.value);};
  ['timeupdate','loadedmetadata','durationchange','play','pause','ended'].forEach(name=>audio.addEventListener(name,update));
  audio.addEventListener('error',()=>{time.textContent='Аудиофайл недоступен';play.disabled=true;});update();
 }
}
function chooseImageSize(initial=640){return new Promise(resolve=>{
 const box=document.createElement('dialog');box.className='rich-size-dialog-v315';box.innerHTML='<form><h3>Размер изображения</h3><label>Ширина, пиксели<input name="width" type="number" min="32" max="4096" required></label><p>Высота изменяется пропорционально. Изображение не выйдет за границы текста.</p><button type="submit">Применить</button><button type="button" data-auto>По ширине текста</button><button type="button" data-cancel>Отмена</button></form>';
 box.querySelector('input').value=String(initial);document.body.append(box);
 const done=value=>{box.close();box.remove();resolve(value);};
 box.querySelector('form').onsubmit=e=>{e.preventDefault();if(box.querySelector('form').reportValidity())done(Number(box.querySelector('input').value));};
 box.querySelector('[data-auto]').onclick=()=>done(0);box.querySelector('[data-cancel]').onclick=()=>done(null);box.addEventListener('cancel',e=>{e.preventDefault();done(null);});box.showModal();
 });}
root.GRPGRichMediaV315={hydrate,chooseImageSize};
if(typeof document!=='undefined'){
 const observer=new MutationObserver(records=>{for(const r of records)for(const n of r.addedNodes)if(n.nodeType===1){if(n.matches('audio[data-grpg-audio-v315]'))hydrate(n.parentNode);else hydrate(n);}});
 observer.observe(document.documentElement,{childList:true,subtree:true});hydrate();
}
})(window);
</script>
</body>
</html>
